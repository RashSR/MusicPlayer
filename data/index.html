<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Music Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #121212;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px;
    }
    
    .track-list {
      padding: 12px;
      max-height: 1000px;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .track-list.collapsed {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
    }

    .app {
      width: 100%;
      max-width: 900px;
      background: #1e1e1e;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .header {
      padding: 24px;
      background: linear-gradient(135deg, #5b21b6, #7c3aed);
    }

    .header h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .header p {
      opacity: 0.9;
    }

    .now-playing {
      padding: 24px;
      border-bottom: 1px solid #333;
    }

    .album-card {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .album-cover {
      width: 120px;
      height: 120px;
      background: #333;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }

    .song-info h2 {
      margin-bottom: 8px;
    }

    .song-info p {
      color: #b3b3b3;
      margin-bottom: 16px;
    }

    .progress {
      width: 100%;
      height: 8px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      width: 35%;
      height: 100%;
      background: #7c3aed;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      background: #7c3aed;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 1rem;
    }

    button:hover {
      background: #6d28d9;
    }

    .upload-section {
      padding: 24px;
      border-bottom: 1px solid #333;
    }

    .upload-box {
      margin-top: 16px;
      background: #2b2b2b;
      padding: 20px;
      border-radius: 16px;
      border: 2px dashed #555;
      text-align: center;
    }

    input[type="file"] {
      margin-top: 12px;
      color: white;
    }

    .albums {
      padding: 24px;
    }

    .albums h2 {
      margin-bottom: 20px;
    }

    .album {
      background: #2b2b2b;
      border-radius: 16px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .album-header {
      padding: 18px;
      background: #353535;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .album-header h3 {
      font-size: 1.1rem;
    }

    .track-list {
      padding: 12px;
    }

    .track {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-radius: 10px;
      transition: 0.2s;
    }

    .track:hover {
      background: #3a3a3a;
    }

    .track-left {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .track-number {
      width: 28px;
      text-align: center;
      color: #aaa;
    }

    .track-name {
      font-weight: 500;
    }

    .footer {
      padding: 20px;
      text-align: center;
      color: #888;
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      .album-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .album-cover {
        width: 100%;
        height: 200px;
      }

      .controls {
        width: 100%;
      }

      button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="app">

    <div class="header">
      <h1>ESP32 Music Player</h1>
      <p>Wi-Fi controlled MP3 player</p>
    </div>

    <div class="now-playing">
      <div class="album-card">
        <img class="album-cover" src="1989.jpg" alt="1989 Album Cover">

        <div class="song-info" style="width: 100%;">
          <h2 id="currentSong">Blank Space</h2>
          <p id="currentAlbum">Taylor Swift • 1989</p>

          <div class="progress">
            <div class="progress-fill"></div>
          </div>

          <div class="controls">
            <button id="shuffleBtn"
              onclick="toggleShuffle()">
              🔀 Shuffle
            </button>
            <button onclick="sendCommand('prev')">⏮ Previous</button>
            <button onclick="sendCommand('pause')">⏯ Play / Pause</button>
            <button onclick="sendCommand('next')">⏭ Next</button>
          </div>
        </div>
      </div>
    </div>

    <div class="upload-section">
      <h2>Upload Music</h2>

      <div class="upload-box">
        <p>Select MP3 files to upload to the ESP32</p>
        <input type="file" multiple accept=".mp3" />
        <br><br>
        <button onclick="alert('Upload functionality comes later with the ESP32 backend.')">
          Upload Files
        </button>
      </div>
    </div>

    <div class="albums">
      <h2>Albums</h2>

      <div class="album">
        <div class="album-header" onclick="toggleAlbum(this)">
          <h3>1989</h3>
            <div>
            <span>Album 01</span>
            <span class="arrow">▼</span>
          </div>
        </div>

        <div class="track-list">
          <div class="track">
            <div class="track-left">
              <div class="track-number">1</div>
              <div class="track-name">Welcome To New York</div>
            </div>
            <button onclick="playTrack(101)">Play</button>
          </div>

          <div class="track">
            <div class="track-left">
              <div class="track-number">2</div>
              <div class="track-name">Blank Space</div>
            </div>
            <button onclick="playTrack(102)">Play</button>
          </div>

          <div class="track">
            <div class="track-left">
              <div class="track-number">3</div>
              <div class="track-name">Style</div>
            </div>
            <button onclick="playTrack(103)">Play</button>
          </div>
        </div>
      </div>

      <div class="album">
        <div class="album-header" onclick="toggleAlbum(this)">
          <h3>Lover</h3>
            <div>
              <span>Album 02</span>
              <span class="arrow">▼</span>
            </div>
        </div>

        <div class="track-list">
          <div class="track">
            <div class="track-left">
              <div class="track-number">1</div>
              <div class="track-name">Cruel Summer</div>
            </div>
            <button onclick="playTrack(201)">Play</button>
          </div>

          <div class="track">
            <div class="track-left">
              <div class="track-number">2</div>
              <div class="track-name">Lover</div>
            </div>
            <button onclick="playTrack(202)">Play</button>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      ESP32 Wi-Fi Music Player Prototype
    </div>
  </div>

  <script>
    function sendCommand(command) {
      console.log('Sending command:', command);

      // Later:
      // fetch('/' + command)

      alert('Command sent: ' + command);
    }

    let shuffleEnabled = false;
    function toggleShuffle() {

        shuffleEnabled = !shuffleEnabled;
        const btn = document.getElementById('shuffleBtn');

        if(shuffleEnabled) {
            btn.style.background = '#22c55e';
        } else {
            btn.style.background = '#7c3aed';
        }

        console.log('Shuffle:', shuffleEnabled);
    }

    function playTrack(trackNumber) {
      console.log('Playing track:', trackNumber);

      // Later:
      // fetch('/play?num=' + trackNumber)

      alert('Playing track: ' + trackNumber);
    }

    function toggleAlbum(header) {

    const trackList = header.nextElementSibling;
    const arrow = header.querySelector('.arrow');

    trackList.classList.toggle('collapsed');

    if(trackList.classList.contains('collapsed')) {
        arrow.innerHTML = '▶';
    } else {
        arrow.innerHTML = '▼';
    }
}
  </script>
</body>
</html>
