<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div class="header">
      <h1>ESP32 Music Player</h1>
      <p>Wi-Fi controlled MP3 player</p>
    </div>

    <div class="now-playing">
      <div class="album-card">
        <img
          id="albumCover"
          class="album-cover"
          src="taylor swift.jpg"
          alt="Album Cover"
        >

        <div class="song-info" style="width: 100%;">
          <h2 id="currentSong">No song selected</h2>  
          <p id="currentAlbum">Choose a track</p>

          <div class="progress">
            <div class="progress-fill"></div>
          </div>

          <div class="controls">
            <button id="shuffleBtn"
              onclick="toggleShuffle()">
              🔀 Shuffle
            </button>
            <button onclick="sendCommand('prev')">⏮ Previous</button>
            <button onclick="sendCommand('pause')">⏯ Play / Pause</button>
            <button onclick="sendCommand('next')">⏭ Next</button>
          </div>
        </div>
      </div>
    </div>

    <div class="upload-section">
      <h2>Upload Music</h2>

      <div class="upload-box">
        <p>Select MP3 files to upload to the ESP32</p>
        <input type="file" multiple accept=".mp3" />
        <br><br>
        <button onclick="alert('Upload functionality comes later with the ESP32 backend.')">
          Upload Files
        </button>
      </div>
    </div>

    <div class="albums">
      <h2>Albums</h2>

      <div id="albumsContainer"></div>
    </div>

    <div class="footer">
      ESP32 Wi-Fi Music Player Prototype
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
