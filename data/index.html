<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div class="header">
      <h1>ESP32 Music Player</h1>
      <p>Wi-Fi controlled MP3 player</p>
    </div>

    <div class="now-playing">
      <div class="album-card">
        <img
          id="albumCover"
          class="album-cover hidden"
          alt="Album Cover"
        >

        <div class="song-info" style="width: 100%;">
          <h2 id="currentSong">No song selected</h2>  
          <p id="currentAlbum">Choose a track</p>

          <div id="progressContainer" class="hidden">
            <div class="time-row">
              <div class="time-display">00:00 / 00:00</div>
            </div>
            <div class="progress">
              <div class="progress-fill"></div>
            </div>
          </div>

          <div class="controls">
            <button id="shuffleBtn" onclick="toggleShuffle()">🔀 Shuffle</button>
            <button onclick="playPreviousTrack()">⏮ Previous</button>
            <button id="playPauseBtn" onclick="togglePlayback()">⏯ Play / Pause</button>
            <button onclick="playNextTrack()">⏭ Next</button>
          </div>
        </div>
      </div>
    </div>

    <div class="albums">
      <h2>Albums</h2>

      <div id="albumsContainer"></div>
    </div>

        <div class="upload-section">
      <h2>Upload Music</h2>

      <div class="upload-box">
        <p>Select MP3 files to upload to the ESP32</p>
        <input type="file" multiple accept=".mp3" />
        <br><br>
        <button onclick="alert('Upload functionality comes later with the ESP32 backend.')">
          Upload Files
        </button>
      </div>
    </div>

    <div class="footer">
      ESP32 Wi-Fi Music Player Prototype
    </div>
  </div>
  <script src="app.js"></script>

  <div id="miniPlayer" class="mini-player hidden">
    <div class="mini-left">
      <img id="miniCover" src="" />
      <div class="mini-info">
        <div id="miniTitle">No song</div>
        <div id="miniAlbum">—</div>
      </div>
      <div class="mini-time">00:00 / 00:00</div>
    </div>
    <div class="mini-progress">
      <div class="mini-progress-fill"></div>
    </div>
    <div class="mini-controls">
      <button onclick="toggleShuffle()" id="miniShuffleBtn">🔀</button>
      <button onclick="playPreviousTrack()">⏮</button>
      <button onclick="togglePlayback()" id="miniPlayBtn">⏯</button>
      <button onclick="playNextTrack()">⏭</button>
    </div>
  </div>
</body>
</html>
