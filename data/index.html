<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div class="header">
      <h1>ESP32 Music Player</h1>
      <p>Wi-Fi controlled MP3 player</p>
    </div>

    <main>
    <div class="now-playing">
      <div class="album-card">
        <img
          id="albumCover"
          class="album-cover hidden"
          alt="Album Cover"
        >

        <div class="song-info" style="width: 100%;">
          <h2 id="currentSong">No song selected</h2>  
          <p id="currentAlbum">Choose a track</p>
          <p id="playbackMessage" class="playback-message" aria-live="polite"></p>

          <div id="progressContainer" class="hidden">
            <div class="time-row">
              <div class="time-display">00:00 / --:--</div>
            </div>
            <div class="progress">
              <div class="progress-fill"></div>
            </div>
          </div>

          <div class="controls">
            <button id="shuffleBtn" onclick="toggleShuffle()">🔀 Shuffle</button>
            <button onclick="playPreviousTrack()">⏮ Previous</button>
            <button id="playPauseBtn" onclick="togglePlayback()">⏯ Play / Pause</button>
            <button onclick="playNextTrack()">⏭ Next</button>
          </div>
          <div class="volume-control">
            <label for="volumeSlider">Volume <span id="volumeValue">8</span>/30</label>
            <input id="volumeSlider" type="range" min="0" max="30" value="8">
          </div>
          <button id="ledToggle" class="led-toggle" type="button"
                  aria-pressed="false" disabled>
            💡 LEDs: Loading...
          </button>
          <span id="ledStatusMessage" class="led-status-message"
                aria-live="polite"></span>
          <div class="led-brightness-control">
            <label for="ledBrightnessSlider">
              LED brightness <span id="ledBrightnessValue">50</span>%
            </label>
            <input id="ledBrightnessSlider" type="range" min="0" max="100"
                   value="50" disabled>
          </div>
          <span id="ledBrightnessMessage" class="led-status-message"
                aria-live="polite"></span>
          <div class="led-saturation-control">
            <label for="ledSaturationSlider">
              LED saturation <span id="ledSaturationValue">130</span>%
            </label>
            <input id="ledSaturationSlider" type="range" min="0" max="150"
                   value="130" disabled>
          </div>
          <span id="ledSaturationMessage" class="led-status-message"
                aria-live="polite"></span>
        </div>
      </div>
    </div>

    <div class="albums">
      <h2>Albums</h2>

      <div id="albumsContainer"></div>
    </div>

    </main>

    <footer class="footer">
      Taylor Swift Music Player · Powered by ESP32-S3
    </footer>
  </div>
  <script src="app.js"></script>

  <div id="miniPlayer" class="mini-player hidden">
    <div class="mini-left">
      <img id="miniCover" src="" />
      <div class="mini-info">
        <div id="miniTitle">No song</div>
        <div id="miniAlbum">—</div>
      </div>
      <div class="mini-time">00:00 / --:--</div>
    </div>
    <div class="mini-progress">
      <div class="mini-progress-fill"></div>
    </div>
    <div class="mini-controls">
      <button onclick="toggleShuffle()" id="miniShuffleBtn">🔀</button>
      <button onclick="playPreviousTrack()">⏮</button>
      <button onclick="togglePlayback()" id="miniPlayBtn">⏯</button>
      <button onclick="playNextTrack()">⏭</button>
    </div>
  </div>
</body>
</html>
